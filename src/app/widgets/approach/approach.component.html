<section
  id="approach"
  appScrollReveal
  class="relative min-h-screen flex flex-col items-center bg-background/50 gap-24 overflow-hidden py-32"
>
  <!-- Background Decorativo -->
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>

  <div class="flex-col flex px-4 space-y-6 w-full items-center relative z-10">
    <div class="approach-header flex flex-col space-y-4 items-center">
      <span class="text-primary font-semibold tracking-widest uppercase text-xs">A Abordagem</span>
      <h2
        class="text-4xl md:text-5xl font-serif leading-tight text-foreground text-center"
      >
        O Caminho da Psicanálise
      </h2>
      <div class="h-1.5 w-12 rounded-full bg-primary/30"></div>
    </div>

    <p class="approach-text text-foreground/60 text-center max-w-2xl text-lg font-light leading-relaxed">
      Um convite à fala livre, onde o silêncio se transforma em escuta e as palavras constroem novas realidades e significados.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 px-4 max-w-7xl relative z-10">
    @for (card of cards; track card.title) {
      <div
        class="approach-card group relative overflow-hidden glass-panel rounded-[2.5rem] p-8 hover:shadow-[0_20px_50px_rgba(var(--primary),0.1)] transition-all duration-500"
      >
        <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-20 transition-opacity">
          <hlm-icon [name]="card.icon" size="xl" class="scale-[2.5] transform -rotate-12"></hlm-icon>
        </div>

        <div
          class="w-14 h-14 bg-primary text-primary-foreground rounded-2xl flex items-center justify-center mb-8 shadow-lg group-hover:scale-110 group-hover:rotate-3 transition-all duration-500"
        >
          <hlm-icon [name]="card.icon" size="sm"></hlm-icon>
        </div>

        <h3 class="text-2xl font-serif text-foreground mb-4">
          {{ card.title }}
        </h3>
        <p class="text-foreground/60 leading-relaxed font-light">
          {{ card.description }}
        </p>
      </div>
    }
  </div>

  <div class="absolute bottom-0 left-0 w-full overflow-hidden leading-none">
    <svg
      class="relative block w-full h-[60px]"
      data-name="Layer 1"
      viewBox="0 0 1200 120"
      preserveAspectRatio="none"
    >
      <path
        d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z"
        class="fill-secondary"
      ></path>
    </svg>
  </div>
</section>
